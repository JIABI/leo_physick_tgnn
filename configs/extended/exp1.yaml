schema_version: 1
experiment_id: EXP1_ACCURACY_TRAP
experiment_configuration_version: EXP1-v1
contracts: [intensity_flow, snapshot]
models: [mlp, physick]
paired_seeds_per_contract: 20
checkpoints_per_model: 50
held_out_episodes_per_checkpoint: 30
checkpoint_selection:
  outcome_blind: true
  rules:
    - minimum_validation_loss
    - loss_matched_0.025
    - loss_matched_0.050
    - loss_matched_0.075
    - loss_matched_0.100
  loss_matched_margin_semantics: relative_to_each_model_validation_minimum
equivalence:
  method: paired_log_ratio_tost
  confidence: 0.90
  aggregate_band: [0.95, 1.05]
  field_band: [0.90, 1.10]
near_tie:
  strata: [[0.0, 0.025], [0.025, 0.050], [0.050, 0.100]]
  chain: [supported, ranking_disagreement, proposal_disagreement, executed_disagreement]
  common_denominator: supported
aba_windows_s: [2.0, 2.5, 3.0, 4.0, 6.0, 10.0]

