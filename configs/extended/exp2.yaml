schema_version: 1
experiment_id: EXP2_CONTRACT_CROSSOVER
experiment_configuration_version: EXP2-v1
phases: [oracle_driven, frozen_predictor]
factors:
  descriptor:
    D0: snapshot_descriptor
    D1: intensity_flow_descriptor
  staging:
    Stage0: current_epoch_fields
    Stage1: causal_staged_fields
  score_map:
    S0: static_weighted_score
    S1: hazard_aware_score_map
cells:
  C1: {descriptor: D0, staging: Stage0, score_map: S0}
  C2: {descriptor: D0, staging: Stage0, score_map: S1}
  C3: {descriptor: D0, staging: Stage1, score_map: S0}
  C4: {descriptor: D0, staging: Stage1, score_map: S1}
  C5: {descriptor: D1, staging: Stage0, score_map: S0}
  C6: {descriptor: D1, staging: Stage0, score_map: S1}
  C7: {descriptor: D1, staging: Stage1, score_map: S0}
  C8: {descriptor: D1, staging: Stage1, score_map: S1}
matched_seed_blocks_per_cell: 10
held_out_episodes_per_block: 30
selector_weights_id: W_BALANCED_V1
selector_rule: current_hard_mask_then_argmax_min_dwell_1s

# Executable binding status.  The v4 source tables preserve cell labels and
# outcomes but do not preserve a field-level formula for every crossed D x S
# pairing.  Code therefore implements the two native manuscript equations and
# fails closed for a crossed pairing until its dated author field ledger is
# supplied through ExplicitCrossoverScoreAdapter.  No result values are
# generated or reconstructed by this config.
binding_contract:
  typed_runner: leo_pg.paper.crossover.CrossoverRunner
  hard_mask_owner: simulator
  identity_join: persistent_local_user_satellite_pair
  new_candidate_policy: explicit_fixed_initializer
  native_reference_bindings:
    D0_x_S0:
      binding_id: D0_S0_snapshot_static_equation_v1
      edge_fields: [gamma, signed_current_feasibility_margin]
      node_fields: [instantaneous_admitted_occupancy]
      weights: {gamma: 1.0, feasibility_margin: 0.5, admitted_load: 0.7}
      directions: {gamma: higher, feasibility_margin: higher, admitted_load: lower}
      evidence: main_methods_snapshot_score_equation
    D1_x_S1:
      binding_id: D1_S1_intensity_flow_hazard_equation_v1
      edge_fields: [gamma, integrated_violation_intensity]
      node_fields: [flow]
      weights: {gamma: 1.0, intensity: 0.5, flow: 0.7}
      directions: {gamma: higher, intensity: lower, flow: lower}
      evidence: main_methods_intensity_flow_score_equation
  author_mapping_required:
    D0_x_S1:
      status: absent_from_v4_field_ledger
      required_adapter: ExplicitCrossoverScoreAdapter
      reason: hazard_aware_score_map_input_under_snapshot_domain_not_recorded
    D1_x_S0:
      status: absent_from_v4_field_ledger
      required_adapter: ExplicitCrossoverScoreAdapter
      reason: static_score_map_input_under_intensity_flow_domain_not_recorded
