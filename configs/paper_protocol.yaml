# Full NTN paper-code orchestration configuration.
#
# Values marked `manuscript_exact` are stated numerically in main_final.tex or
# si_final.tex. Values marked `estimated` are necessary implementation choices
# that the recovered manuscript/source bundle does not uniquely determine.
# They must remain visible in every run manifest and should be replaced if the
# original author configuration is recovered.

seed: 17
run_seeds: [17, 29, 43, 61, 79]
K_users: 128
S_sats: 1000

ephemeris:
  # The released workspace does not contain the original 1,000-satellite TLE
  # snapshot. This deterministic VLEO kinematic constellation is an explicit
  # estimated replacement for code completeness, not the public-trace replay.
  mode: debug
  user_radius: 6371.0
  satellite_radius: 6721.0
  user_speed: 0.008
  satellite_speed: 7.70
  pos_scale: 0.000148787382824
  vel_scale: 0.129870129870

paper_protocol:
  horizon_steps: 200
  dt_ctrl: 0.1
  dt_phy: 0.001
  candidates:
    minimum_elevation_deg: 10.0
    topk: 6
  feasibility:
    gamma_min_db: -5.0
    flow_max: 0.95
    capacity_users: 40
    admission_order: keyed_random
  phy:
    # Dimensionless implementation of the documented link proxy. The physical
    # fc/B/Ptx/NF/loss metadata is retained below for provenance.
    noise_power: 1.0
    interference_eta: 0.6
    reference_power: 10.0
    distance_reference: 350.0
    pathloss_exponent: 2.0
    shadow_sigma: 0.1
    interference_power: 1.0
    physical_metadata:
      carrier_frequency_ghz: 20.0
      bandwidth_mhz: 20.0
      transmit_power_dbw: 20.0
      noise_figure_db: 3.0
      extra_loss_db: 2.0
  flow:
    arrival_rate: 0.8
    service_rate: 1.0
    feedback_strength: 0.25
    ema_factor: 0.9
    phi: global_mean
    clip_lower: 0.0
    clip_upper: 1.0
  intensity:
    baseline_hazard: 0.1
    beta_gamma: 0.8
    beta_flow: 0.9
    beta_elevation: 0.2
    gamma_covariate_scale_db: 10.0
    elevation_covariate_scale_deg: 90.0
    horizon: 10.0
    num_intervals: 128
  policy:
    # Protocol A is the manuscript main protocol. Set true only for the
    # explicitly named hard-mask Protocol B sensitivity.
    hard_feasibility_mask: false
    gamma_weight: 1.0
    load_weight: 0.4
    intensity_weight: 0.6
    min_dwell_steps: 10
    hysteresis: 0.16666666666666666
  policy_initializer:
    kind: configured_prior
    gamma: -3.0
    intensity: 0.1
    flow: 0.5

model:
  node_in_dim: 7
  edge_in_dim: 7
  mem_dim: 128
  msg_dim: 128
  emb_dim: 128
  message_type: physick
  aggregator: sum
  dropout: 0.1
  use_edge_type: true
  edge_type_vocab: 8
  message_passing_layers: 2
  # Shared by the GRU TGN and every long-context temporal-mixer replacement.
  node_injection: 0.1
  time_encoding_dim: 16
  physick:
    implementation: paper_intensity_flow
    num_kernels: 16
    projection_radius: 1.0
    latent_dim: 128
    descriptor_dim: 16
    kernel_hidden_dim: 128
    coeff_hidden: 128
    operating_clip: 5.0

head:
  type: intensity_flow
  hidden_dim: 128
  dropout: 0.1

paper_dataset:
  output: artifacts/data/ntn_paper_schema_v1.pt
  # Formal runs write a lightweight index plus one restricted-unpickler-safe
  # .pt shard per episode. Use monolithic only for deliberately small fixtures.
  storage_layout: episode_shards
  episodes: 2230
  # Manuscript: 2,000 train and 30 held-out evaluation episodes. Validation
  # count is not reported; 200 episodes (10% of train) is an estimated choice.
  split_counts: [2000, 200, 30]
  split_ratios: [0.8968609865470852, 0.08968609865470852, 0.013452914798206279]
  split_seed: 7001

paper_training:
  output_dir: artifacts/checkpoints
  epochs: 50
  batch_size_control_graphs: 32
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  learning_rate_schedule: constant
  checkpoint_selection: minimum_validation_loss
  loss_weights:
    # Estimated scale-balancing weights. Raw gamma is in dB and would otherwise
    # dominate log-intensity/flow losses. Replace with author values if found.
    gamma: 0.01
    intensity: 1.0
    flow: 1.0
    feasibility: 0.1
    decision_aware: 0.2
  objective:
    kind: one_step_teacher_forcing
    rollout_horizon: 1
  scheduled_sampling:
    enabled: false
    schedule: linear
    start_probability: 0.0
    maximum_probability: 0.5
    start_epoch: 0
    end_epoch: 25
  action_coupled_multistep:
    enabled: false
    horizons: [5, 10, 20]
    discount: 1.0
    # A true action-coupled rollout feeds every staged model descriptor back to
    # the fixed policy. Scheduled-sampling studies may override this explicitly.
    model_feedback_probability: 1.0
    action_temperature: 0.1
    state_loss_weight: 1.0

# Independent Snapshot branch for the 2 x 2 interface/operator factorial.
# Its graph tensors contain current gamma, a current gate margin and
# instantaneous pre-EMA admitted load. They contain neither integrated
# intensity nor raw/EMA flow, so the interface comparison cannot leak the
# Intensity--Flow state through a shared feature tensor.
paper_snapshot:
  dataset:
    output_template: artifacts/data/{method}_snapshot_schema_v1.pt
    storage_layout: episode_shards
  feature:
    gamma_scale: 10.0
    admitted_load_scale: 1.0
  margin:
    gamma_min: -5.0
    load_max: 0.95
    # The manuscript does not uniquely state the scalar margin normalization.
    # These gate-preserving scales are explicit estimated implementation values.
    gamma_scale: 10.0
    load_scale: 0.95
  head:
    hidden_dim: 128
    dropout: 0.1
    load_bounds: [0.0, 1.0]
  initial_oracle_admitted_load: 0.0
  stream_initializer:
    kind: constant_snapshot_v1
    gamma: -3.0
    feasibility_margin: 0.0
    admitted_load: 0.5
  loss_weights:
    gamma: 0.01
    feasibility_margin: 1.0
    admitted_load: 1.0
  decision_aware_weight: 0.2
  decision_loss:
    gamma_scale: 10.0
    feasibility_scale: 1.0
    load_scale: 1.0
    soft_rank_temperature: 0.1
    pair_margin: 0.0
  policies:
    snapshot_mlp:
      # SI-selected Snapshot+MLP score weights.
      score_weights: {gamma: 1.0, feasibility: 0.6, load: 0.8}
      hard_feasibility_mask: false
      min_dwell_steps: 10
      hysteresis: 0.16666666666666666
      provenance: manuscript_selected
    snapshot_physick:
      # SI-selected Snapshot+PhysiCK score weights.
      score_weights: {gamma: 1.0, feasibility: 0.4, load: 0.8}
      hard_feasibility_mask: false
      min_dwell_steps: 10
      hysteresis: 0.16666666666666666
      provenance: manuscript_selected
    snapshot_ltt_r:
      score_weights: {gamma: 1.0, feasibility: 0.6, load: 0.8}
      hard_feasibility_mask: false
      min_dwell_steps: 10
      hysteresis: 0.16666666666666666
      provenance: explicit_estimate_not_reported
    snapshot_da_gwm:
      score_weights: {gamma: 1.0, feasibility: 0.6, load: 0.8}
      hard_feasibility_mask: false
      min_dwell_steps: 10
      hysteresis: 0.16666666666666666
      provenance: explicit_estimate_not_reported

# Isolated UAV/shared-service second platform. The formal resolver requires
# every field below, so paper runs cannot silently inherit hidden defaults.
uav_shared:
  protocol_version: 1
  episode_seed: 17
  density_multiplier: 1
  capacity_compression: 1.0
  exact:
    # Numerically reported in the manuscript/SI.
    control_dt_s: 1.0
    evaluation_horizon_steps: 120
    nominal_uav_count: 24
    station_count: 6
    density_multipliers: [1, 2, 3, 4, 5]
    capacity_compressions: [1.0, 0.75, 0.5]
    candidate_topk: 3
    active_slots_per_station: 2
    fifo_queue_capacity: 8
    feasible_start_reserve_fraction: 0.15
    intensity_lookahead_s: 12.0
    eta_clip: [0.0, 1.0]
    station_flow_clip: [0.0, 1.0]
    intensity_clip: [0.0, 3.0]
  estimated:
    # Executable placeholders for dynamics not numerically fixed by the paper.
    region_width_m: 1000.0
    region_height_m: 1000.0
    station_boundary_margin_fraction: 0.10
    max_speed_m_s: 25.0
    max_turn_rate_rad_s: 0.7853981633974483
    heading_jitter_rad: 0.03490658503988659
    docking_radius_m: 12.0
    maximum_reachable_distance_m: 800.0
    nominal_battery_units: 100.0
    initial_energy_fraction_min: 0.65
    initial_energy_fraction_max: 1.0
    travel_energy_units_per_m: 0.02
    idle_energy_units_per_s: 0.03
    service_energy_units_per_s: 1.5
    nominal_service_duration_s: 8.0
    service_duration_jitter_s: 2.0
    flow_memory: 0.85
    flow_queue_weight: 0.45
    flow_occupancy_weight: 0.35
    flow_inbound_weight: 0.20
    eta_travel_weight: 0.50
    eta_arrival_energy_weight: 0.50
    intensity_start_eta_weight: 0.45
    intensity_energy_margin_weight: 0.30
    intensity_station_flow_weight: 0.25
  provenance:
    exact:
      status: manuscript_exact
      source: "main_final.tex:824-861; si_final.tex:2923-2985,3482-3523"
    estimated:
      status: explicit_estimate
      source: "Not numerically specified in main_final.tex or si_final.tex"

# Learning/evaluation contract for the isolated UAV/shared-service platform.
# Values marked estimated make the recovered software executable; they are not
# represented as the lost publication configuration.
uav_pipeline:
  schema_version: 1
  dataset:
    storage_layout: episode_shards
    output: artifacts/uav/uav_dataset.pt
    train_horizon_steps: 60
    evaluation_horizon_steps: 120
    train_episodes_per_run: 240
    validation_episodes_per_run: 40
    test_episodes_per_run: 80
    run_seeds: [17, 29, 43, 61, 79]
    split_seed: 1709
    provenance:
      horizons_counts_runs: manuscript_exact
      integer_run_seeds: explicit_estimate
  graph:
    contract_version: 1
    uav_feature_dim: 9
    station_feature_dim: 6
    edge_feature_dim: 6
    stable_edge_id: uav_id_times_station_count_plus_station_id
  policy:
    eta_weight: 1.0
    intensity_weight: 0.6
    flow_weight: 0.4
    hard_feasible_start_mask: false
    hysteresis: 0.3333333333333333
    provenance: explicit_estimate_cross_platform_mapping
  initializer:
    kind: configured_prior
    eta: 0.5
    intensity: 1.5
    station_flow: 0.0
    provenance: explicit_estimate_not_reported
  model:
    architecture: bipartite_uav_station_world_model_v1
    uav_in_dim: 9
    station_in_dim: 6
    edge_in_dim: 6
    hidden_dim: 128
    message_dim: 128
    message_passing_layers: 2
    dropout: 0.1
    head_hidden_dim: 128
    head_dropout: 0.1
    intensity_max: 3.0
    provenance:
      shared_width_depth_dropout: explicit_estimate_inherited_from_ntn
      architecture_details: explicit_estimate
  training:
    objective: one_step_teacher_forcing
    epochs: 50
    batch_size_control_graphs: 32
    tbptt_steps: 1
    learning_rate: 0.0005
    weight_decay: 0.0001
    gradient_clip_norm: 1.0
    device: cpu
    loss_weights:
      eta: 1.0
      log1p_intensity: 1.0
      station_flow: 1.0
      feasibility: 0.2
    scheduled_sampling:
      enabled: false
      start_probability: 0.0
      maximum_probability: 1.0
      start_epoch: 1
      end_epoch: 50
    action_coupled_multistep:
      enabled: false
      rollout_horizon: 10
      model_feedback_probability: 1.0
    provenance:
      optimizer_schedule: manuscript_shared_training_protocol
      loss_weights: explicit_estimate_not_reported
  evaluation:
    output: artifacts/uav/evaluation
    include_one_step_loss: true
    modes: [model, oracle, eta, intensity, flow, intensity_flow]
    horizon_steps: 120
    episodes_per_run: 80
    bootstrap_resamples: 10000
    bootstrap_seed: 17117
    bootstrap_confidence: 0.95
  metrics:
    pingpong_window_seconds: 2.0
    near_tie_margin: 0.3333333333333333
    tail_probability: 0.10
    service_failure_denominator: assignment_attempts_plus_failed_service_starts
    station_load_source: queue_plus_active_slots

paper_evaluation:
  horizon_steps: 600
  episodes_per_seed: 30
  modes: [model, oracle, gamma, intensity, flow, intensity_flow]
  output_dir: artifacts/evaluation
  outage_gamma_db: -3.0
  pingpong_window_seconds: 2.0
  bandwidth_hz: 20000000.0
  bootstrap_resamples: 10000
  bootstrap_seed: 17001
  bootstrap_confidence: 0.95
  tail_risk_probability: 0.10
  metrics:
    enabled: true
  risk_shield:
    enabled: false
    mode: veto
    delta: 1.0
    downweight_strength: 1.0
  calibration:
    kind: none
    quantile: 0.95
    conformal_alpha: 0.05
  shrink_jump:
    quantiles: [0.90, 0.95, 0.99]
    dwell_steps: [2, 5, 10, 15, 20]
    epsilon: 0.00000001

paper_baselines:
  ltt_r:
    kind: ltt_r
    node_in_dim: 7
    edge_in_dim: 7
    model_dim: 384
    spatial_layers: 2
    dropout: 0.1
    temporal:
      type: transformer
      context_length: 200
      num_layers: 6
      num_heads: 8
      # 1,392 gives 11,997,603 trainable parameters with the Snapshot head,
      # matching the manuscript's reported 12.0M class.
      ffn_dim: 1392
    training:
      objective: action_coupled_multistep
      rollout_horizon: 10
      # The manuscript gives H=10 but not the rollout minibatch count. Three
      # sequences expose 30 control graphs per optimizer step, the closest
      # explicit estimate to the reported 32-graph one-step batch.
      rollout_sequence_batch_size: 3
      budget_multiplier: 3.0
      target_parameter_class_millions: 12.0
  da_gwm:
    kind: da_gwm
    node_in_dim: 7
    edge_in_dim: 7
    hidden_dim: 256
    gat_layers: 4
    gat_heads: 8
    dropout: 0.1
    decision_loss:
      gamma_weight: 1.0
      load_weight: 0.4
      intensity_weight: 0.6
      gamma_scale: 10.0
      flow_scale: 1.0
      log1p_intensity_scale: 1.0
      soft_rank_temperature: 0.1
      pair_margin: 0.0
      near_tie_strength: 1.0
      near_tie_temperature: 0.05
    training:
      objective: decision_aware_action_coupled
      rollout_horizon: 10
      rollout_sequence_batch_size: 3
      budget_multiplier: 2.5
      target_parameter_class_millions: 8.7
  s4:
    kind: s4
    # Inherit model.physick, the 128-d node/message/readout contract, candidate
    # graph and global intensity_flow head. Only the GRU update is replaced.
    architecture: paper_physick_temporal_swap_v1
    interface: intensity_flow
    message_operator: paper_physick
    temporal:
      type: s4
      context_length: 200
      num_layers: 4
      dropout: 0.1
      s4_kwargs:
        d_state: 64
  mamba2:
    kind: mamba2
    architecture: paper_physick_temporal_swap_v1
    interface: intensity_flow
    message_operator: paper_physick
    temporal:
      type: mamba2
      context_length: 200
      num_layers: 4
      d_state: 128
      d_conv: 4
      expand: 2
      headdim: 64
      dropout: 0.1
  conformer:
    kind: conformer
    architecture: paper_physick_temporal_swap_v1
    interface: intensity_flow
    message_operator: paper_physick
    temporal:
      type: conformer
      context_length: 200
      num_layers: 4
      num_heads: 8
      ffn_dim: 1024
      depthwise_conv_kernel_size: 31
      dropout: 0.1
  big_mlp:
    kind: big_mlp
    architecture: paper_tgn_big_message_mlp_v2
    shared_backbone: paper_tgn_128d_2layer_intensity_flow_v1
    replacement_scope: message_operator_only
    interface: intensity_flow
    node_in_dim: 7
    edge_in_dim: 7
    # Shared Paper TGN backbone. BigMLP changes only the internal width of the
    # two-linear-layer message MLP.
    memory_dim: 128
    message_dim: 128
    embedding_dim: 128
    message_passing_layers: 2
    message_hidden_dim: 2400
    message_layers: 2
    aggregator: sum
    node_injection: 0.1
    edge_chunk: 50000
    dropout: 0.1
    head_hidden_dim: 128
    head_dropout: 0.1
    capacity_target_params: 2100000
    capacity_tolerance_params: 50000
    capacity_target_provenance: manuscript_si_runtime_table_2p1m_rounded_0p1m
    decision_loss: null
  edge_attn:
    kind: edge_attn
    architecture: paper_tgn_edge_attention_v2
    shared_backbone: paper_tgn_128d_2layer_intensity_flow_v1
    replacement_scope: message_operator_only
    interface: intensity_flow
    node_in_dim: 7
    edge_in_dim: 7
    # Shared Paper TGN backbone. Only the message function is GAT-style.
    memory_dim: 128
    message_dim: 128
    embedding_dim: 128
    message_passing_layers: 2
    attention_hidden_dim: 1792
    attention_heads: 8
    attention_dropout: 0.1
    node_injection: 0.1
    aggregator: sum
    edge_chunk: 50000
    dropout: 0.1
    head_hidden_dim: 128
    head_dropout: 0.1
    capacity_target_params: 2100000
    capacity_tolerance_params: 50000
    capacity_target_provenance: manuscript_si_runtime_table_2p1m_rounded_0p1m
    decision_loss: null
  temp_trans:
    kind: temp_trans
    architecture: paper_tgn_mlp_temporal_transformer_v2
    shared_backbone: paper_tgn_128d_2layer_intensity_flow_v1
    replacement_scope: temporal_mixing_only
    interface: intensity_flow
    node_in_dim: 7
    edge_in_dim: 7
    # Shared MLP message graph/readout; only the GRU temporal mixer is replaced.
    memory_dim: 128
    message_dim: 128
    embedding_dim: 128
    message_passing_layers: 2
    aggregator: sum
    node_injection: 0.1
    edge_chunk: 50000
    context_length: 200
    transformer_layers: 5
    transformer_heads: 8
    ffn_dim: 1408
    dropout: 0.1
    head_hidden_dim: 128
    head_dropout: 0.1
    capacity_target_params: 2400000
    capacity_tolerance_params: 50000
    capacity_target_provenance: manuscript_si_runtime_table_2p4m_rounded_0p1m
    decision_loss: null

controller_sweeps:
  a3:
    offsets_db: [1.0, 3.0, 5.0, 7.0]
    ttt_steps: [1, 3, 5, 8]
    selected: {offset_db: 3.0, ttt_steps: 3}
    provenance: manuscript_grid
  cho:
    preparation_offset_db: [1.0, 3.0, 5.0]
    preparation_steps: [1, 2, 3]
    validity_steps: [5, 10, 20]
    execution_offset_db: 0.0
    provenance: estimated_grid
  load_aware_greedy:
    load_penalty_db: [2.0, 4.0, 6.0, 8.0]
    hysteresis_db: [1.0, 3.0, 5.0]
    provenance: estimated_grid

parameter_provenance:
  manuscript_exact:
    - K_users=128 and S_sats=1000
    - dt_phy=1ms and dt_ctrl=100ms
    - train/eval horizons=200/600 steps
    - elevation=10deg, Top-k=6, capacity=40
    - gamma_out=-3dB, gamma_min=-5dB, flow_max=0.95
    - flow=(arrival 0.8, service 1.0, feedback 0.25, EMA 0.9)
    - score weights=(1.0,0.4,0.6), dwell=10, hysteresis=1/6
    - Cox beta=(0.8,0.9,0.2), horizon=10s, trapezoids=128
    - hidden/message=128, layers=2, kernels=16, signed-l1 radius=1
    - AdamW lr=5e-4, wd=1e-4, dropout=0.1, clip=1, batch=32, epochs=50
    - train episodes=2000, eval episodes=30, runs=5
    - A3 offsets=(1,3,5,7)dB and TTT=(1,3,5,8), selected=(3dB,3)
    - LTT-R horizon=10 and target capacity=12.0M; DA-GWM target=8.5-8.7M
    - runtime-table parameter classes BigMLP=2.1M, EdgeAttn=2.1M, TempTrans=2.4M (reported to 0.1M)
    - main shield delta=1; bootstrap resamples=10000
  estimated:
    run_seed_values: "The manuscript reports five runs but not their integer seeds."
    debug_ephemeris: "Original 1,000-satellite TLE snapshot and phases are absent."
    phy_normalization: "Paper gives physical metadata but not the exact proxy conversion."
    flow_phi: "The numeric Phi(L) implementation is absent; global_mean is monotone."
    cox_baseline_hazard: "lambda_0 is absent; 0.1/s is a neutral explicit prior."
    cox_feature_scales: "Normalization scales are absent; 10 dB and 90 deg are explicit."
    policy_initializer: "D0/new-edge initializer was not reported."
    validation_episodes: "200 is 10% of the reported 2,000 training episodes."
    loss_weights: "Chosen to balance raw-dB gamma against bounded/log targets."
    node_injection: "The node-feature injection coefficient is unreported; 0.1 makes the existing TGN update explicit and is shared by temporal swaps."
    scheduled_sampling_schedule: "Maximum probability and annealing schedule are unreported."
    cho_parameters: "Preparation/validity window values are not reported."
    load_aware_parameters: "Load-to-dB conversion and hysteresis grid are not reported."
    a3_ttt_units: "The numeric TTT grid is reported, but the table/prose do not uniquely resolve steps versus seconds; the primary code records control steps and also supports seconds explicitly."
    s4_mamba2_conformer_depths: "Only the drop-in families and shared 128-dimensional PhysiCK graph/readout contract are reported."
    runtime_baseline_architectures: "The named replacement scopes and shared 128-d/two-layer TGN contract are manuscript-reported. Internal replacement widths, attention heads, and Transformer depth/context are unreported; the configured estimates are constrained to the SI runtime table's rounded 2.1M/2.1M/2.4M capacity classes, not to the smaller reconstructed PhysiCK implementation."
