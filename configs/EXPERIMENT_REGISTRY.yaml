schema_version: 2
software_version: 2.0.0
title: Predictive accuracy alone does not determine feedback-coupled world-model control
authoritative_parameter_contract: configs/manuscript_v4.yaml
authoritative_extended_registry: configs/experiments_v4.yaml

evidence_contract:
  code_scope: interface_model_analysis_implementation
  training_invoked_by_quickstart: false
  manuscript_results_generated_by_quickstart: false
  source_data_verification_supported: true
  semantic_cpu_demo_supported: true

replication_contracts:
  satellite:
    independent_reporting_runs_per_cell: 10
    held_out_episodes_per_run: 30
    point_estimate: equal_weight_mean_of_run_means
    interval: two_sided_student_t_95
    degrees_of_freedom: 9
  uav:
    independent_reporting_runs: 5
    held_out_episodes_per_run: 30
    point_estimate: equal_weight_mean_of_run_means
    interval: paired_run_first_hierarchical_bootstrap_95
    bootstrap_draws: 10000
  checkpoint_equivalence:
    independent_paired_seeds_per_contract: 20
    checkpoint_selection_access: validation_loss_only
    aggregate_band: [0.95, 1.05]
    field_band: [0.90, 1.10]
    interval: paired_geometric_ratio_tost_90

satellite:
  implementation_root: code/satellite
  resolved_protocol: code/satellite/configs/paper_protocol.yaml
  studies: code/satellite/configs/studies.yaml
  extended_implementations:
    EXP1: code/satellite/src/leo_pg/paper/extended_experiments.py
    EXP2: code/satellite/src/leo_pg/paper/crossover.py
    EXP3: code/satellite/src/leo_pg/paper/extended_experiments.py
    EXP5: code/satellite/src/leo_pg/paper/extended_experiments.py
  publication_models:
    - snapshot_mlp
    - snapshot_physick
    - tgn_mlp
    - tgn_kan
    - tgn_physick
    - ltt_r
    - snapshot_da_gwm
    - intensity_flow_da_gwm
    - mrg_ppo
  classical_controls: [a3, conditional_handover, load_aware_greedy]

uav:
  implementation_root: code/uav
  resolved_protocol: code/uav/configs/common.yaml
  publication_operators: [mlp, kan, physick]
  studies:
    - UAV-OPERATOR
    - UAV-DENSITY
    - UAV-CAPACITY
    - UAV-MISMATCH
    - UAV-SUBSTITUTION
    - UAV-ABLATION

provenance_boundary:
  EXP4:
    status: provenance_incomplete
    full_rerun_enabled: false
    reason: environment identity, source version, developer, trace split and field mapping are not recorded

