schema_version: 1
paper_version: v8
title: Controller-facing state design for feedback-coupled world-model control

replication_contract:
  independent_training_runs_per_method: 5
  held_out_episodes_per_run: 30
  matched_within_platform:
    - episode_id
    - exogenous_sequence_id
    - initial_state_id
  checkpoint_reuse_as_training_run: forbidden
  point_estimate: equal_weight_mean_of_run_means
  interval: paired_run_first_hierarchical_percentile_bootstrap
  bootstrap_draws: 10000
  undefined_denominator: undefined_not_zero

satellite:
  implementation_root: code/satellite
  authoritative_registry: code/satellite/configs/studies.yaml
  planner: python -m leo_pg.paper.release_cli
  studies:
    FCT-CL: crossed Snapshot/Intensity-Flow by MLP/PhysiCK closed-loop study
    DEC-K: held-out next-step decision diagnostics
    STRS-K: reported stress-index sweep
    LONG-HORIZON-300S: 300-second action-coupled trajectory study
    FCT-DWELL: dwell sensitivity at 5, 10, 20 and 40 steps
    EPH-REPLAY: author-supplied public-ephemeris replay
    ORACLE-LADDER: policy-boundary descriptor substitutions
    ABLATIONS: component and temporal-memory interventions
    ROLLOUT-AWARE: teacher forcing, scheduled sampling and H=5/10/20 rollouts
    SCORE-WEIGHT-SENSITIVITY: fixed-checkpoint score-weight perturbations
    SNAPSHOT-WEIGHT-SELECTION: validation-only Snapshot score selection
    LEARNED-CONTROLS: LTT-R and DA-GWM study controls
    CLASSICAL-CONTROLS: A3, conditional handover and load-aware controls
  publication_methods:
    - snapshot_mlp
    - snapshot_physick
    - tgn_mlp
    - tgn_kan
    - tgn_physick
    - snapshot_ltt_r
    - snapshot_da_gwm
    - da_gwm
  exploratory_temporal_ablations:
    - s4
    - mamba2

uav:
  implementation_root: code/uav
  authoritative_registry: code/uav/uav_cfs/experiments.py
  dispatcher: python code/uav/cli/run_experiments.py
  studies:
    UAV-OPERATOR: MLP/KAN/PhysiCK ordering and decision diagnostics
    UAV-DENSITY: density multipliers m=1,2,3,4,5
    UAV-CAPACITY: capacity factors chi=1.0,0.75,0.5
    UAV-MISMATCH: four author-parameterized structural mismatches
    UAV-SUBSTITUTION: local-cue/Intensity/Flow/joint/full descriptor replacement
    UAV-ABLATION: full/no-Intensity/no-Flow/no-gain/local-cue-only conditions
  publication_methods:
    - mlp
    - kan
    - physick

