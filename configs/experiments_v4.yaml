schema_version: 1
paper_version: current_main_and_si_2026_08_26

FCT-CL:
  design: interface_by_operator_2x2
  interfaces: [snapshot, intensity_flow]
  operators: [mlp, physick]
  independent_runs_per_cell: 10
  held_out_episodes_per_run: 30
  shared: [candidate_generator, hard_mask, role_weights, dwell, hysteresis, episodes, executor]

EXP1:
  name: accuracy_trap_checkpoint_and_window_sensitivity
  contracts: [intensity_flow, snapshot]
  models: [mlp, physick]
  paired_seeds_per_contract: 20
  checkpoints_per_model: 50
  held_out_episodes_per_checkpoint: 30
  selection_rules:
    - minimum_validation_loss
    - loss_matched_0.025
    - loss_matched_0.050
    - loss_matched_0.075
    - loss_matched_0.100
  selection_uses_outcomes: false
  aggregate_equivalence_band: [0.95, 1.05]
  field_equivalence_band: [0.90, 1.10]
  near_tie_strata: [[0.0, 0.025], [0.025, 0.050], [0.050, 0.100]]
  aba_windows_s: [2.0, 2.5, 3.0, 4.0, 6.0, 10.0]

EXP2:
  name: controller_interface_crossover
  phases: [oracle_driven, frozen_predictor]
  factors:
    descriptor:
      D0: snapshot
      D1: intensity_flow
    staging:
      Stage0: current_epoch
      Stage1: causal_staged
    score_map:
      S0: static_weighted
      S1: hazard_aware
  cells: [C1, C2, C3, C4, C5, C6, C7, C8]
  matched_seed_blocks_per_cell: 10
  held_out_episodes_per_block: 30
  weights_id: W_BALANCED_V1
  selector_rule: current_hard_mask_then_argmax_min_dwell_1s
  native_executable_score_bindings: [D0_x_S0, D1_x_S1]
  author_adapter_required_score_bindings: [D0_x_S1, D1_x_S0]
  historical_eight_cell_rerun_from_release: false
  limitation: v4 aggregate tables do not record the two cross-domain field maps or state trajectories

EXP3:
  name: objective_by_operator_factorial
  interface: intensity_flow
  matched_seed_blocks: 20
  checkpoints_per_arm: 50
  held_out_episodes_per_block: 30
  transitions_per_arm: 400000
  gradient_updates_per_arm: 31250
  arms:
    A1: {operator: mlp, objective: predictive}
    A2: {operator: physick, objective: predictive}
    B1: {operator: mlp, objective: decision_aware}
    B2: {operator: physick, objective: decision_aware}
  decision_aware_objective:
    field_loss_weight: 1.0
    pairwise_logistic_weight: 0.20
    listmle_top5_weight: 0.10
    margin_weight: 0.05
    margin: 0.05
  aba_ratio_of_rate_ratios:
    correction: add_0.5_to_each_four_arm_event_count
    role: secondary

EXP4:
  name: external_environment_evaluation
  included_in_manuscript: false
  reproducible_from_release: false
  provenance_status: incomplete
  reason: environment identity, source version, developer, trace split and field mapping are not recorded

EXP5:
  name: ordered_physick_mechanism_ablation
  design: ordered_four_variant
  interface: intensity_flow
  matched_seed_blocks: 12
  checkpoints_per_variant: 50
  held_out_episodes_per_block: 30
  variants:
    - mlp
    - generic_dynamic_mixture
    - unprojected_physick
    - projected_physick
  projected_variant_radius: 1.25
  deployed_radius: 1.0
  predictive_loss_equivalence_band: [0.95, 1.05]
  adjacent_regret_contrasts_use_holm: true
