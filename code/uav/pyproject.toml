[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controller-facing-state-uav"
version = "2.0.0"
description = "UAV shared-service platform for controller-facing state experiments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["uav_cfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
