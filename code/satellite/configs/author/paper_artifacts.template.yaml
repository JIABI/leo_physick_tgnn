# Exactly 30 held-out episode seeds/IDs per run. Conditions within a run reuse
# this panel and the corresponding exogenous sequence IDs.
held_out_panels:
  run01: {episode_seeds: [], episode_ids: [], exogenous_sequence_ids: []}
  run02: {episode_seeds: [], episode_ids: [], exogenous_sequence_ids: []}
  run03: {episode_seeds: [], episode_ids: [], exogenous_sequence_ids: []}
  run04: {episode_seeds: [], episode_ids: [], exogenous_sequence_ids: []}
  run05: {episode_seeds: [], episode_ids: [], exogenous_sequence_ids: []}
