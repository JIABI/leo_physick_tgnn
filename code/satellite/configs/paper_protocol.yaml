# Satellite experiment configuration. The author manifest supplies the
# run-specific ephemeris, seeds and study parameters.

seed: 17
run_seeds: [17, 29, 43, 61, 79, 101, 127, 151, 181, 211]
K_users: 128
S_sats: 160

ephemeris:
  # Factorial runs use the frozen seeded visibility source below. Public-
  # ephemeris replay overrides this with skyfield_tle plus a TLE manifest.
  mode: debug
  tle_path: null
  start_time_utc: null

paper_protocol:
  horizon_steps: 200
  dt_ctrl: 0.1
  dt_phy: 0.001
  candidates:
    minimum_elevation_deg: 10.0
    topk: 6
    thinning_enabled: true
  visibility:
    source: frozen_clipped_distribution
    mean: 47.0
    standard_deviation: 3.2
    minimum: 38
    maximum: 58
    episode_index: 0
    stress_adjustment: 0
    shared_across_factorial_cells: true
  feasibility:
    gamma_min_db: -5.0
    flow_max: 0.95
    capacity_users: 40
    admission_order: keyed_random
  phy:
    # Dimensionless implementation of the documented link proxy. The physical
    # fc/B/Ptx/NF/loss metadata is retained below for provenance.
    noise_power: 1.0
    interference_eta: 0.6
    reference_power: 10.0
    distance_reference: 350.0
    pathloss_exponent: 2.0
    shadow_sigma: 0.1
    interference_power: 1.0
    physical_metadata:
      carrier_frequency_ghz: 20.0
      bandwidth_mhz: 20.0
      transmit_power_dbw: 20.0
      noise_figure_db: 3.0
      extra_loss_db: 2.0
  flow:
    arrival_rate: 0.8
    service_rate: 1.0
    feedback_strength: 0.25
    ema_factor: 0.9
    freeze: false
    phi: global_mean
    clip_lower: 0.0
    clip_upper: 1.0
  intensity:
    representation: integrated_cox
    baseline_hazard: 0.1
    beta_gamma: 0.8
    beta_flow: 0.9
    beta_elevation: 0.2
    gamma_covariate_scale_db: 10.0
    elevation_covariate_scale_deg: 90.0
    horizon: 10.0
    num_intervals: 128
  policy:
    # Simulator authorization is applied before rank construction in every
    # reported interface/operator cell.
    hard_feasibility_mask: true
    gamma_weight: 1.0
    load_weight: 0.7
    intensity_weight: 0.5
    min_dwell_steps: 10
    hysteresis: 0.16666666666666666
  policy_initializer:
    kind: configured_prior
    gamma: -3.0
    intensity: 0.1
    flow: 0.5

model:
  node_in_dim: 7
  edge_in_dim: 7
  mem_dim: 128
  msg_dim: 128
  emb_dim: 128
  message_type: physick
  aggregator: sum
  dropout: 0.1
  temporal_memory: true
  edge_feature_mask: []
  use_edge_type: true
  edge_type_vocab: 8
  message_passing_layers: 2
  # Shared by the GRU TGN and every long-context temporal-mixer replacement.
  node_injection: 0.1
  time_encoding_dim: 16
  physick:
    implementation: paper_intensity_flow
    num_kernels: 16
    projection_radius: 1.0
    latent_dim: 128
    descriptor_dim: 16
    kernel_hidden_dim: 128
    coeff_hidden: 128
    operating_clip: 5.0
    use_kernel_bank: true

head:
  type: intensity_flow
  hidden_dim: 128
  dropout: 0.1

paper_dataset:
  output: artifacts/data/ntn_paper_schema_v1.pt
  # Formal runs write an index plus one restricted-unpickler-safe shard per episode.
  storage_layout: episode_shards
  episodes: 2230
  # The author manifest overrides the validation count for a recorded run.
  split_counts: [2000, 200, 30]
  split_ratios: [0.8968609865470852, 0.08968609865470852, 0.013452914798206279]
  split_seed: 7001

paper_training:
  output_dir: artifacts/checkpoints
  epochs: 50
  batch_size_control_graphs: 32
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  learning_rate_schedule: constant
  checkpoint_selection: minimum_validation_loss
  loss_weights:
    # The author manifest overrides the recorded multitask weights.
    gamma: 0.01
    intensity: 1.0
    flow: 1.0
    feasibility: 0.1
    decision_aware: 0.2
  objective:
    kind: one_step_teacher_forcing
    rollout_horizon: 1
  scheduled_sampling:
    enabled: false
    schedule: linear
    start_probability: 0.0
    maximum_probability: 0.5
    start_epoch: 0
    end_epoch: 25
  action_coupled_multistep:
    enabled: false
    horizons: [5, 10, 20]
    discount: 1.0
    # A true action-coupled rollout feeds every staged model descriptor back to
    # the fixed policy. Scheduled-sampling studies may override this explicitly.
    model_feedback_probability: 1.0
    action_temperature: 0.1
    state_loss_weight: 1.0

# Independent Snapshot branch for the 2 x 2 interface/operator factorial.
# Its graph tensors contain current gamma, a current gate margin and
# instantaneous pre-EMA admitted load. They contain neither integrated
# intensity nor raw/EMA flow, so the interface comparison cannot leak the
# Intensity--Flow state through a shared feature tensor.
paper_snapshot:
  dataset:
    output_template: artifacts/data/{method}_snapshot_schema_v1.pt
    storage_layout: episode_shards
  feature:
    gamma_scale: 10.0
    admitted_load_scale: 1.0
  margin:
    gamma_min: -5.0
    load_max: 0.95
    # The author manifest overrides the recorded gate-preserving scales.
    gamma_scale: 10.0
    load_scale: 0.95
  head:
    hidden_dim: 128
    dropout: 0.1
    load_bounds: [0.0, 1.0]
  initial_oracle_admitted_load: 0.0
  stream_initializer:
    kind: constant_snapshot_v1
    gamma: -3.0
    feasibility_margin: 0.0
    admitted_load: 0.5
  loss_weights:
    gamma: 0.01
    feasibility_margin: 1.0
    admitted_load: 1.0
  decision_aware_weight: 0.2
  decision_loss:
    gamma_scale: 10.0
    feasibility_scale: 1.0
    load_scale: 1.0
    soft_rank_temperature: 0.1
    pair_margin: 0.0
  policies:
    snapshot_mlp:
      score_weights: {gamma: 1.0, feasibility: 0.5, load: 0.7}
      hard_feasibility_mask: true
      min_dwell_steps: 10
      hysteresis: 0.16666666666666666
      provenance: manuscript_fixed_role_positions
    snapshot_physick:
      score_weights: {gamma: 1.0, feasibility: 0.5, load: 0.7}
      hard_feasibility_mask: true
      min_dwell_steps: 10
      hysteresis: 0.16666666666666666
      provenance: manuscript_fixed_role_positions
    snapshot_ltt_r:
      score_weights: {gamma: 1.0, feasibility: 0.5, load: 0.7}
      hard_feasibility_mask: true
      min_dwell_steps: 10
      hysteresis: 0.16666666666666666
      provenance: configured_reference
    snapshot_da_gwm:
      score_weights: {gamma: 1.0, feasibility: 0.5, load: 0.7}
      hard_feasibility_mask: true
      min_dwell_steps: 10
      hysteresis: 0.16666666666666666
      provenance: configured_reference


paper_evaluation:
  horizon_steps: 600
  episodes_per_seed: 30
  reporting_inference:
    independent_unit: training_run
    run_count: 10
    point_estimate: equal_weight_mean_of_run_means
    interval: two_sided_student_t_95
    paired_contrast_interval: paired_student_t_95
    degrees_of_freedom: 9
  modes: [model, oracle, gamma, intensity, flow, intensity_flow]
  output_dir: artifacts/evaluation
  outage_gamma_db: -3.0
  pingpong_window_seconds: 2.0
  bandwidth_hz: 20000000.0
  # Retained only for within-run nonlinear diagnostic bundles. Manuscript
  # reporting inference is the run-first Student-t contract above and is
  # implemented by the root scripts/summarize_results.py entry point.
  diagnostic_bootstrap_resamples: 10000
  diagnostic_bootstrap_seed: 17001
  diagnostic_bootstrap_confidence: 0.95
  tail_risk_probability: 0.10
  metrics:
    enabled: true
  risk_shield:
    enabled: false
    mode: veto
    delta: 1.0
    downweight_strength: 1.0
  calibration:
    kind: none
    quantile: 0.95
    conformal_alpha: 0.05
  shrink_jump:
    quantiles: [0.90, 0.95, 0.99]
    dwell_steps: [5, 10, 20, 40]
    epsilon: 0.00000001

paper_baselines:
  ltt_r:
    kind: ltt_r
    node_in_dim: 7
    edge_in_dim: 7
    model_dim: 384
    spatial_layers: 2
    dropout: 0.1
    temporal:
      type: transformer
      context_length: 64
      num_layers: 6
      num_heads: 8
      ffn_dim: 1536
    training:
      objective: action_coupled_multistep
      rollout_horizon: 10
      # Three H=10 sequences expose 30 control graphs per optimizer step.
      rollout_sequence_batch_size: 3
      budget_multiplier: 3.0
      target_parameter_class_millions: 12.0
  da_gwm:
    kind: da_gwm
    node_in_dim: 7
    edge_in_dim: 7
    hidden_dim: 256
    gat_layers: 4
    gat_heads: 8
    dropout: 0.1
    decision_loss:
      gamma_weight: 1.0
      load_weight: 0.7
      intensity_weight: 0.5
      gamma_scale: 10.0
      flow_scale: 1.0
      log1p_intensity_scale: 1.0
      soft_rank_temperature: 0.1
      pair_margin: 0.0
      near_tie_strength: 1.0
      near_tie_temperature: 0.05
    training:
      objective: decision_aware_action_coupled
      rollout_horizon: 10
      rollout_sequence_batch_size: 3
      budget_multiplier: 2.5
      target_parameter_class_millions: 8.7
  s4:
    kind: s4
    # Inherit model.physick, the 128-d node/message/readout contract, candidate
    # graph and global intensity_flow head. Only the GRU update is replaced.
    architecture: paper_physick_temporal_swap_v1
    interface: intensity_flow
    message_operator: paper_physick
    temporal:
      type: s4
      context_length: 200
      num_layers: 4
      dropout: 0.1
      s4_kwargs:
        d_state: 64
  mamba2:
    kind: mamba2
    architecture: paper_physick_temporal_swap_v1
    interface: intensity_flow
    message_operator: paper_physick
    temporal:
      type: mamba2
      context_length: 200
      num_layers: 4
      d_state: 128
      d_conv: 4
      expand: 2
      headdim: 64
      dropout: 0.1

# Exact online-parameter identities reported in Supplementary Table S11 and
# Zenodo v4 TABLE2_LEARNED_CONTROL_OBSERVED_SUMMARY.csv.  The strict builder in
# leo_pg.paper.model_identity refuses to attach one of these frozen IDs unless
# the executable constructor has exactly the reported number of trainable
# forward parameters.  These values are evidence-ledger targets, not requests
# to allocate unused padding.
paper_model_ledger:
  TGN-PHYSICK-SNAPSHOT-v1.0:
    method: snapshot_physick
    interface: snapshot
    reported_online_parameters: 742913
    evidence: supplementary_table_s11_and_zenodo_v4_table2
  TGN-PHYSICK-IF-v1.0:
    method: tgn_physick
    interface: intensity_flow
    reported_online_parameters: 758401
    evidence: supplementary_table_s11_and_zenodo_v4_table2
  LTT-R-H10-v1.0:
    method: snapshot_ltt_r
    interface: snapshot
    reported_online_parameters: 12041857
    evidence: supplementary_table_s11_and_zenodo_v4_table2
  DA-GWM-SNAPSHOT-H10-v1.0:
    method: snapshot_da_gwm
    interface: snapshot
    reported_online_parameters: 8527361
    evidence: supplementary_table_s11_and_zenodo_v4_table2
  DA-GWM-IF-H10-v1.0:
    method: da_gwm
    interface: intensity_flow
    reported_online_parameters: 8684929
    evidence: supplementary_table_s11_and_zenodo_v4_table2
controller_sweeps:
  a3:
    offsets_db: [1.0, 3.0, 5.0, 7.0]
    ttt_seconds: [1.0, 3.0, 5.0, 8.0]
    ttt_unit: seconds
    dt_ctrl: 0.1
    selected: {offset_db: 3.0, ttt_seconds: 3.0}
    provenance: manuscript_grid
  cho:
    preparation_offset_db: [1.0, 3.0, 5.0]
    preparation_steps: [1, 2, 3]
    validity_steps: [5, 10, 20]
    execution_offset_db: 0.0
    provenance: configured_grid
  load_aware_greedy:
    load_penalty_db: [2.0, 4.0, 6.0, 8.0]
    hysteresis_db: [1.0, 3.0, 5.0]
    provenance: configured_grid
