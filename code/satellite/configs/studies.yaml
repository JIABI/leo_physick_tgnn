schema_version: 1
paper_version: v8

shared:
  runs: 5
  held_out_episodes_per_run: 30
  bootstrap_draws: 10000
  evaluation_horizon_steps: 600
  no_shield_delta: 1.0

studies:
  FCT-CL:
    description: Crossed Snapshot/Intensity--Flow by MLP/PhysiCK study.
    methods: [snapshot_mlp, snapshot_physick, tgn_mlp, tgn_physick]
    substitution_modes:
      snapshot: [model, oracle]
      intensity_flow: [model, oracle, gamma, intensity, flow, intensity_flow]

  DEC-K:
    description: Held-out next-step re-ranking diagnostics at reported stress indices.
    methods: [tgn_mlp, tgn_kan, tgn_physick]
    stress_indices: [100, 300, 500]
    metrics: [top1_agreement, candidate_kendall_tau, near_tie_flip_rate, oracle_score_regret]
    near_tie_margin: 0.05

  STRS-K:
    description: Zero-shot action-coupled reported-stress sweep.
    methods: [tgn_mlp, tgn_kan, tgn_physick]
    train_stress_index: 100
    stress_indices: [100, 150, 200, 300, 400, 500]
    substitution_modes: [model, oracle]

  LONG-HORIZON-300S:
    description: Fig. 2a action-coupled K=500 trajectories over 300 s.
    methods: [tgn_mlp, tgn_physick]
    stress_index: 500
    horizon_seconds: 300
    horizon_steps: 3000
    substitution_modes: [model, oracle]

  FCT-DWELL:
    description: Intensity--Flow + PhysiCK dwell sensitivity; D=10 is the FCT-CL anchor.
    methods: [tgn_physick]
    dwell_steps: [5, 10, 20, 40]
    substitution_modes: [model, oracle]

  EPH-REPLAY:
    description: Geometry-input replay from author-supplied public TLE snapshots.
    methods: [tgn_mlp, tgn_kan, tgn_physick]
    replay_families: [starlink, oneweb, kuiper, mixed]
    substitution_modes: [model, oracle]

  ORACLE-LADDER:
    description: Policy-boundary field substitutions with simulator authority unchanged.
    methods: [tgn_physick]
    substitution_modes: [model, oracle, gamma, intensity, flow, intensity_flow]

  ABLATIONS:
    description: Component, temporal and simulator-coupling interventions.
    methods: [tgn_physick, s4, mamba2]
    exploratory_methods: [s4, mamba2]
    named_conditions:
      - full
      - without_kernel_bank
      - without_cox_descriptor
      - instantaneous_hazard_only
      - without_thinning
      - cut_load_sinr
      - static_flow_ema
      - broadcast_aggregation
      - no_temporal_memory

  ROLLOUT-AWARE:
    description: Snapshot + PhysiCK scheduled/action-coupled objective ladder.
    methods: [snapshot_physick, tgn_physick]
    objectives: [teacher_forcing, scheduled_sampling, rollout_H5, rollout_H10, rollout_H20]
    rollout_horizons: [5, 10, 20]
    substitution_modes: [model, oracle]

  SCORE-WEIGHT-SENSITIVITY:
    description: Fixed-checkpoint Intensity--Flow score-weight perturbations.
    methods: [tgn_physick]
    reference: {gamma_weight: 1.0, load_weight: 0.4, intensity_weight: 0.6}
    perturbations:
      reference: {gamma_weight: 1.0, load_weight: 0.4, intensity_weight: 0.6}
      load_x0p5: {gamma_weight: 1.0, load_weight: 0.2, intensity_weight: 0.6}
      load_x1p5: {gamma_weight: 1.0, load_weight: 0.6, intensity_weight: 0.6}
      intensity_x0p5: {gamma_weight: 1.0, load_weight: 0.4, intensity_weight: 0.3}
      intensity_x1p5: {gamma_weight: 1.0, load_weight: 0.4, intensity_weight: 0.9}
      load_intensity_x0p75: {gamma_weight: 1.0, load_weight: 0.3, intensity_weight: 0.45}
      load_intensity_x1p25: {gamma_weight: 1.0, load_weight: 0.5, intensity_weight: 0.75}
    substitution_modes: [model, oracle]

  SNAPSHOT-WEIGHT-SELECTION:
    description: Validation-only grid selection for the two reported Snapshot cells.
    methods: [snapshot_mlp, snapshot_physick]
    score_grid:
      gamma: [0.5, 0.75, 1.0, 1.25, 1.5]
      feasibility: [0.2, 0.4, 0.6, 0.8]
      load: [0.2, 0.4, 0.6, 0.8]

  LEARNED-CONTROLS:
    description: Capacity/objective controls in the manuscript.
    methods: [snapshot_ltt_r, snapshot_da_gwm, da_gwm]
    substitution_modes:
      snapshot: [model, oracle]
      intensity_flow: [model, oracle]

  CLASSICAL-CONTROLS:
    description: A3 sweep, conditional handover and load-aware greedy selection.
    methods: [tgn_physick]
    controller_families: [a3, cho, load_aware_greedy]
