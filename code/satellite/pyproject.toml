[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controller-facing-state-satellite"
version = "1.0.0"
description = "Full satellite implementation for controller-facing state experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "torch>=2.1",
  "skyfield>=1.45",
  "sgp4>=2.23",
]

[project.optional-dependencies]
paper = ["torch-geometric>=2.5", "einops>=0.7"]
test = ["pytest>=8"]

[project.scripts]
cfs-satellite = "leo_pg.paper.release_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
